name: Elastifile
description: >-
  Elastifile was an enterprise cloud file-storage company founded in 2013 in Tel Aviv, Israel. It
  built a software-defined, scale-out distributed file system (the Elastifile Cloud File System /
  ECFS) that delivered elastic, high-performance NFS-compatible shared storage for enterprise-grade
  applications running at scale in the public cloud, with the ability to scale capacity out or in on
  demand. Backed by Battery Ventures and Lightspeed Venture Partners (among others), Elastifile was
  acquired by Google Cloud in August 2019 (reported at roughly $200M) and its technology was folded
  into Google Cloud Filestore, powering the Filestore High Scale / Enterprise tiers. Elastifile no
  longer operates as an independent company or brand: elastifile.com redirects to Google Cloud
  Filestore, and there is no standalone Elastifile developer portal, API, or SDK surface to enrich.
